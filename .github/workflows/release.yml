name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # A GitHub release and a registry entry are public the moment they land,
  # so the full check suite gates them.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check tag matches server.json version
        run: |
          version=$(jq -r .version server.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server.json version $version" >&2
            exit 1
          fi

      - name: Test
        run: make test

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and publish the GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the .mcpb bundle and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r bundle sha < <(scripts/release-mcpb.sh "$GITHUB_REF_NAME")
          gh release upload "$GITHUB_REF_NAME" "$bundle"
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/msgraph-mcp.mcpb"
          jq --arg v "$version" --arg url "$url" --arg sha "$sha" \
            '.version = $v | .packages[0].version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.release.json

      - uses: actions/upload-artifact@v7
        with:
          name: server-json
          path: server.release.json

  mcp-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP registry OIDC login
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP registry
        run: |
          mv server.release.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
