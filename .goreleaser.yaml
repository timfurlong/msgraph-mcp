version: 2

project_name: msgraph-mcp

builds:
  - id: msgraph-mcp
    binary: msgraph-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

universal_binaries:
  - id: msgraph-mcp-universal
    ids: [msgraph-mcp]
    replace: false
    name_template: msgraph-mcp

archives:
  - id: default
    ids: [msgraph-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: timfurlong
    name: msgraph-mcp
